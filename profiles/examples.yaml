# Example Pi agent profiles (OP1.2 / JEF-6 + OP1.6 / JEF-10 defaults + OP1.9 / JEF-15 GitHub identities).
#
# Fresh installs already expose built-in `scout`, `worker`, and `reviewer`
# (model-agnostic, see `profiles/scout.yaml`, `worker.yaml`, `reviewer.yaml`
# and `prompts/*.md`). Copy the blocks below into
# `$PI_CODING_AGENT_DIR/profiles.yaml` (user/global) or
# `<projectRoot>/.pi/profiles.yaml` (project) to select models or add
# project-specific skills while retaining the default role policy:
#
#   profiles:
#     scout:
#       model: <fast-model>
#     worker:
#       model: <coding-model>
#     reviewer:
#       model: <reasoning-model>
#
# Validate with:
#   orca-pi profile inspect scout --project-root .
#   orca-pi profile inspect scout --project-root . --context-summary
#
# Rules: `extends` is single-parent (cycles/unknown parents fail pre-launch);
# arrays replace wholesale in v1; `systemPrompt`/`systemPromptFile` are
# mutually exclusive; paths are project-relative (no absolute/`..` escapes).

profiles:
  readonly:
    tools: [read, grep, find, ls]
    skills: []
    extensions: []
    contextFiles: false
    discoverSkills: false
    discoverExtensions: false
    session: ephemeral
    displayName: Read-only
    description: Safe code exploration without writes.

  scout:
    extends: readonly
    model: anthropic/claude-haiku
    thinking: low
    systemPromptFile: .pi/agents/scout.md
    skills: [.pi/skills/repo-search]
    displayName: Scout
    description: Fast repository search and triage.

  worker:
    model: anthropic/claude-sonnet
    thinking: high
    systemPromptFile: .pi/agents/worker.md
    tools: [read, grep, find, ls, bash, edit, write]
    skills: [.pi/skills/project, .pi/skills/testing]
    contextFiles: true
    githubIdentity: worker
    displayName: Worker
    description: Coding worker with full tool access.

  reviewer:
    model: anthropic/claude-sonnet
    thinking: high
    systemPromptFile: .pi/agents/reviewer.md
    tools: [read, grep, find, ls, bash]
    skills: []
    extensions: []
    contextFiles: false
    discoverSkills: false
    discoverExtensions: false
    session: ephemeral
    githubIdentity: reviewer
    displayName: Reviewer
    description: Independent review with blocking vs non-blocking findings.
