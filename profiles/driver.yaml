# Driver profile: orchestrator-pi (in-process subagent layer).
#
# This is the Orca worker Pi session that fans out to stock gotgenes subagents
# (scout/task/reviewer/oracle/designer/planner from agents/). It implements
# AND delegates within one Pi process:
# - full tools (it edits code); orchestration policy arrives via the
#   pi-extensions/driver-context extension (tagged prompt section, active
#   only when the `subagent` tool is registered — never in leaves), and
#   model aliases resolve via pi-extensions/model-aliases.ts (tool_call
#   rewrite from model-aliases.json — no framework fork required).
# - The subagent framework itself is NOT vendored: each machine installs the
#   pinned stock package once (`pi install npm:@gotgenes/pi-subagents@22.0.0`,
#   also declared in settings.json `packages`), so `discoverExtensions` stays
#   true here and ambient user packages load too. That variance is accepted
#   consciously: it keeps zero framework bytes in-repo and tracks upstream
#   without re-vendoring. Our two pi-extensions are committed paths, so they
#   exist in every Orca worktree by git construction.
# - skills: [] — the pi-orchestration SKILL.md is a pointer stub only; the
#   policy travels via the extension surface children do not inherit.
# - session is `fresh` so background subagents track across the run.
# - NEVER attach orca-pi-orchestration or run `orca-pi spawn` here: nested
#   Orca supervision causes double-spend and worktree chaos. Escalation inside
#   this layer is ask_parent → oracle → resume (see pi-extensions/playbook.md).
#   gotgenes strips subagent tools from children unconditionally, so leaves
#   cannot nest — oracle queries are always driver-mediated.
# - Shell caveat: this profile keeps `bash` for implementation/validation, so
#   `orca-pi spawn` remains *executable* here. The separation is enforced at
#   the tool/skill/extension layer; the shell is shared surface. Treat any
#   non-coordinator dispatch as a bug: fence with `orca-pi stop` and report.
#
# Install (one-time, mirrors the profiles/examples.yaml flow): copy this
# `driver:` block into $PI_CODING_AGENT_DIR/profiles.yaml or
# <projectRoot>/.pi/profiles.yaml, then `orca-pi profile inspect driver`.
# Plus per-machine: `pi install npm:@gotgenes/pi-subagents@22.0.0`,
# `cp agents/*.md ~/.pi/agent/agents/`, merge
# model-aliases/model-aliases.json.example into ~/.pi/agent/model-aliases.json.
# Launch: orca-pi spawn driver --task "<issue handoff>" --worktree new-child --name <issue> --json
# Validate with: orca-pi profile inspect driver --project-root .

profiles:
  driver:
    thinking: high
    systemPrompt: |-
      You are an issue driver. Decompose the task, delegate research/review to
      subagents, implement the core change, and validate it.

      Rules:
      - Fan out first: spawn scout for unfamiliar code before implementing.
      - Implement the smallest scoped change that meets acceptance criteria.
      - Review every diff: resume reviewer on the change, apply blocking findings.
      - Escalate when stuck: ask oracle via a fresh subagent call with full context,
        then resume the blocked leaf with the answer (`subagent` + `resume:` —
        `steer_subagent` rejects ended turns). Leaves cannot spawn — you mediate.
      - Validate: run the focused tests/typecheck/lint covering the change.
      - Report: changed files, validation results, unresolved concerns, subagent IDs used.

      Output format:
      1. Plan (scout findings → approach)
      2. Changes (file — what changed and why)
      3. Reviews (reviewer verdict — findings applied)
      4. Validation (command — result)
      5. Unresolved concerns (explicit; write "None" if empty)
    tools: [read, grep, find, ls, bash, edit, write]
    skills: []
    extensions: [pi-extensions/driver-context.ts, pi-extensions/model-aliases.ts]
    contextFiles: true
    discoverSkills: false
    discoverExtensions: true
    session: fresh
    githubIdentity: worker
    displayName: Driver
    description: Issue driver. Implements and fans out to in-process subagents.
